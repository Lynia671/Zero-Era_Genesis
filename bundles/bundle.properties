planet.ZegPlanets-svitton.name = Svitton
planet.ZegPlanets-svitton.description = A massive, dark world captured by the Serpulo-Erekir sun centuries ago, Zeg is locked in a perpetual state of extreme cold. Its crushing atmospheric pressure and dense cloud layers trap violent, unending blizzards that scour the surface, with winds howling constantly in shifting gales. Temperatures never climb above -97°C, and plunge as low as -179°C in the long shadows. With over 73% of its crust permanently sealed under glacial ice and compacted snow, sunlight barely pierces the thick haze, casting the planet in an eternal, dim twilight. Despite its crushing mass and hostile climate, factions have already begun to dig into the frozen crust... unaware of what might lie dormant beneath the ice.

block.zeg-ice-wall-crusher.name = Ice Wall Crusher
block.zeg-mechanical-drill.name = Mechanical Drill

block.ZegBlock-wind-power-drill.name = Wind Power Drill
block.ZegBlock-wind-powered-drill.description = It utilises wind power to accelerate the rotation of the drilling rig, greatly increasing mining efficiency.

block.zeg-core-zero.name = Zero Boundary

item.ZegItems-raw-ice.name = Raw Ice
item.ZegItems-raw-ice.description = The crude ice collected from extreme cold ice layers or snow walls must be heated before it can be turned into usable liquid water.

item.ZegItems-zero-iron.name = Zero Iron
item.ZegItems-zero-iron.description = A common mineral resource, but with very poor material strength.\nUsed for basic industrial manufacturing at any time.

item.ZegItems-bauxite.name = Bauxite  
item.ZegItems-bauxite.description = Aluminum in Dirt...?

item.ZegItems-aluminum.name = Aluminum  
item.ZegItems-aluminum.description = It has excellent electrical conductivity and is commonly used in various types of manufacturing.

item.ZegItems-crystalline-lithium.name = Crystalline Lithium  
item.ZegItems-crystalline-lithium.description = It is a rapidly consumable item in every aspect, enough to reflect its importance.

item.ZegItems-frozen-sand.name = Frozen Sand
item.ZegItems-frozen-sand.description = Svetton planet's surface commonly found resources. Due to extremely low temperatures, the sand grains are tightly bound and difficult to crush directly
