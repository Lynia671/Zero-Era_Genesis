planet.zeg_mod-svitton.name = Svitton
planet.zeg_mod-svitton.description = A massive, dark world captured by the Serpulo-Erekir sun centuries ago, Zeg is locked in a perpetual state of extreme cold. Its crushing atmospheric pressure and dense cloud layers trap violent, unending blizzards that scour the surface, with winds howling constantly in shifting gales. Temperatures never climb above -97\u00B0C, and plunge as low as -179\u00B0C in the long shadows. With over 73% of its crust permanently sealed under glacial ice and compacted snow, sunlight barely pierces the thick haze, casting the planet in an eternal, dim twilight. Despite its crushing mass and hostile climate, factions have already begun to dig into the frozen crust... unaware of what might lie dormant beneath the ice.

block.zeg_mod-ice-wall-crusher.name = Ice Wall Crusher
block.zeg_mod-ice-wall-crusher.description = Crushing walls, produces raw ice at a lower efficiency.

block.zeg_mod-laser-drilling-machine.name = Laser drilling machine
block.zeg_mod-laser-drilling-machine.description = Used to drill for available resources in the wall

block.zeg_mod-mechanical-drill.name = Mechanical Drill
block.zeg_mod-mechanical-drill.description = The drill bit is of excellent craftsmanship, but the speed is not like...

block.zeg_mod-wind-power-drill.name = Wind Power Drill
block.zeg_mod-wind-powered-drill.description = It utilises wind power to accelerate the rotation of the drilling rig, greatly increasing mining efficiency.

item.zeg_mod-raw-ice.name = Raw Ice
item.zeg_mod-raw-ice.description = The crude ice collected from extreme cold ice layers or snow walls must be heated before it can be turned into usable liquid water.

item.zeg_mod-zero-iron.name = Zero Iron
item.zeg_mod-zero-iron.description = A common mineral resource, but with very poor material strength.\nUsed for basic industrial manufacturing at any time.

item.zeg_mod-bauxite.name = Bauxite
item.zeg_mod-bauxite.description = Aluminum in Dirt...?

item.zeg_mod-aluminum.name = Aluminum
item.zeg_mod-aluminum.description = It has excellent electrical conductivity and is commonly used in various types of manufacturing.

item.zeg_mod-crystalline-lithium.name = Crystalline Lithium
item.zeg_mod-crystalline-lithium.description = It is a rapidly consumable item in every aspect, enough to reflect its importance.

item.zeg_mod-Permafrost.name = Permafrost
item.zeg_mod-Permafrost.description = There are usually some resources on the surface of the planet Svitton. Due to the extremely low temperatures, the soil freezes and is difficult to crush.

techtree.svitton = Svitton

block.zeg_mod-core-one.name = Zero Boundary
block.zeg_mod-core-one.description = First-generation core. Provides basic defense and storage capabilities.\nCan be upgraded by being covered with a more advanced core.

unit.zeg_mod-delta.name = delta
unit.zeg_mod-delta.description = The first-generation core machine, considering that the harsh climate of this planet is not suitable for the movement of flying units, adopted leg units with greater stability.

block.zeg_mod-core-two.name = Ruiler
block.zeg_mod-core-two.description = Second-generation core. Enhanced the storage system. \nCan be upgraded by higher-level cores.

unit.zeg_mod-epsilon.name = epsilon
unit.zeg_mod-epsilon.description = The second-generation core machine uses the boosting capability from other units and can overcome some obstacles that are otherwise impassable.

block.zeg_mod-core-three.name = Crystal
block.zeg_mod-core-three.description = Third-generation core. Uses crystal-reinforced structure, significantly enhancing defense and storage capacity. \nCan be upgraded by higher-level cores.

