item.ZegItems-crystalline-lithium.description = 它在各个方面都是一种极易消耗的物品，这一点足以体现其重要性。

item.ZegItems-frozen-sand.name = 冻沙
item.ZegItems-crystalline-lithium.description = 在斯维特顿这颗星球的表面通常存在一些资源。由于温度极低，导致沙粒之间紧密结合，难以碾碎

item.ZegItems-raw-ice.name = 碎冰
item.ZegItems-raw-ice.description = 从极寒冰层或雪墙收集的碎冰必须加热，才能转化为可用的液态水。

item.ZegItems-zero-iron.name = 零铁
item.ZegItems-raw-ice.description = 一种常见的矿产资源，但材料强度很差。\n可用于基本的工业制造。
