planet.ZegItems-svitton.name = 斯维特顿
planet.ZegItems-svitton.description = 一个庞大而黑暗的世界，几个世纪前被塞普洛-埃雷基尔太阳捕获，泽格被永远困在极寒状态中。其沉重的大气压和浓密的云层困住了狂暴无尽的暴风雪，肆虐地表，风不断呼啸，伴随着不断变化的狂风。气温从未超过-97°C，在长阴影中最低可降至-179°C。超过 73%的地壳永久被冰川冰层和压实的积雪覆盖，阳光几乎无法穿透厚厚的雾气，使这颗星球陷入永恒昏暗的暮光中。尽管这里体量巨大且气候恶劣，各派系已开始挖掘冰冻地壳......不知道冰层下可能潜藏着什么。

